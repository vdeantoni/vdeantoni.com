<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Debounced Logger</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fff;
        color: #18181b;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-sizing: border-box;
        padding: 16px 24px 24px;
      }
      #console {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 12px 16px;
        overflow: auto;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        background: #fafafa;
        color: #3f3f46;
        font: 13px/1.6 ui-monospace, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #console:empty::before {
        content: "Type in the field. Each debounced console.log call shows up here.";
        color: #a1a1aa;
      }
    </style>
    <style>
      .App {
        font-family: sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="console" aria-live="polite"></pre>
    <script>
      // The demo logs with console.log, so copy each call onto the page
      const output = document.getElementById("console");
      const log = console.log;
      console.log = (...args) => {
        log(...args);
        output.textContent += args.join(" ") + "\n";
        output.scrollTop = output.scrollHeight;
      };
    </script>
    <script src="debounce.js"></script>
  </body>
</html>
