<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>prefers-color-scheme</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        box-sizing: border-box;
        padding: 24px 32px;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
    </style>
    <style>
      body {
        background: white;
        color: black;
      }

      @media (prefers-color-scheme: light) {
        body {
          background: white;
          color: black;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: black;
          color: white;
        }
      }
    </style>
  </head>
  <body>
    <h1>Lorem ipsum</h1>
    <p>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod
      tempor incididunt ut labore et dolore magna aliqua. Quis varius quam
      quisque id diam. Felis imperdiet proin fermentum leo vel orci porta non.
      Scelerisque viverra mauris in aliquam.
    </p>
  </body>
</html>
