<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slide-out animation</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
      }
      p {
        margin: 0 0 0 24px;
        color: #71717a;
        font: 13px/1.4 system-ui, sans-serif;
      }
    </style>
    <style>
      #box {
          width: 50px;
          height: 50px;
          background-color: blue;
      }
    </style>
  </head>
  <body>
    <p>Click the box.</p>
    <div id="box"></div>
    <script>
      const slideOut = (element, duration) => {
        const initial = 0;
        const target = window.innerWidth;

        const start = new Date();

        const loop = () => {
          const time = (new Date().getTime() - start.getTime()) / 1000; // in seconds
          const value = target * (time / duration) * (time / duration) + initial;

          element.style.transform = `translateX(${value}px)`;

          if (value >= target) {
            element.style.transform = ``;
            return;
          }

          window.requestAnimationFrame(loop);
        };

        window.requestAnimationFrame(loop);
      };

      const box = document.getElementById("box");

      box.addEventListener("click", event => {
        slideOut(event.target, 1);
      });
    </script>
  </body>
</html>
