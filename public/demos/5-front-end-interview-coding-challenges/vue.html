<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emulate Vue.js</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
        color: #18181b;
      }
      body {
        display: grid;
        gap: 16px;
        padding: 16px 24px 24px;
        font-family: sans-serif;
      }
      h2 {
        margin: 0;
        color: #71717a;
        font: 500 12px/1 system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      pre,
      #app {
        margin: 0;
        padding: 12px 16px;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
      }
      pre {
        background: #fafafa;
        color: #3f3f46;
        font: 13px/1.6 ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <h2>Template</h2>
    <pre id="template"></pre>
    <h2>Result</h2>
    <div id="app">
      {{ message }} and {{ message }}
      <p>:) {{ anotherMessage }} (:</p>
      {{ invalid }}
    </div>
    <script>
      // Shows the markup before the demo replaces its template strings
      document.getElementById("template").textContent = document
        .getElementById("app")
        .outerHTML.replace(/^ {4}/gm, "");
    </script>
    <script>
      class Vue {
        constructor(options) {
          this.el = document.querySelector(options.el);
          this.data = options.data;

          this.replaceTemplateStrings();
        }

        replaceTemplateStrings() {
          const stack = [this.el];
          while (stack.length) {
            const n = stack.pop();
            if (n.childNodes.length) {
              stack.push(...n.childNodes);
            }

            if (n.nodeType === Node.TEXT_NODE) {
              this.replaceText(n);
            }
          }
        }

        replaceText(node) {
          let text = node.textContent;
          let result = "";

          let state = 0; // 0 searching template, 1 searching key
          let cursor = 0;

          for (let i = 0; i < text.length - 1; i++) {
            switch (state) {
              case 0:
                if (text[i] === "{" && text[i + 1] === "{") {
                  state = 1;
                  result += text.substring(cursor, i);
                  cursor = i;
                }
                break;
              case 1:
                if (text[i] === "}" && text[i + 1] === "}") {
                  state = 0;
                  result += this.data[text.substring(cursor + 2, i).trim()];
                  cursor = i + 2;
                }
                break;
              default:
            }
          }

          result += text.substring(cursor);

          node.textContent = result;
        }
      }

      var app = new Vue({
        el: "#app",
        data: {
          message: "Hello Vue!",
          anotherMessage: "Bye Vue!"
        }
      });
    </script>
  </body>
</html>
