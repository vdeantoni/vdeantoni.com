<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A draggable button that changes the background color</title>
    <style>
      body {
        background: #fff;
      }
      p {
        position: absolute;
        top: 16px;
        left: 24px;
        margin: 0;
        color: #71717a;
        font: 13px/1.4 system-ui, sans-serif;
      }
    </style>
    <style>
      html, body {
        margin: 0;
      }

      #button {
        cursor: pointer;
        background-color: black;
        width: 50px;
        height: 50px;
        border-radius: 50px;

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translateX(-50%) translateY(-50%);
      }

      #overlay {
        background-color: red;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <p>Drag the button toward the edges.</p>
    <div id="overlay"></div>
    <div id="button" draggable="true"></div>
    <script src="drag-to-change-background-color.js"></script>
  </body>
</html>
